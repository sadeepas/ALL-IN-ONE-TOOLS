<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script src="security.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Blog Post Beautifier</title>
    
    <!-- Dynamic SVG Web Icon (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z'/></svg>" type="image/svg+xml">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Animations */
        .ai-pulse-ring {
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(37, 99, 235, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        
        .ai-spin { animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .ai-spin-slow { animation: spin 4s linear infinite; }
        
        /* Fade transition */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Loader fade out */
        .fade-out { opacity: 0; transition: opacity 0.6s ease-out; pointer-events: none; }
    </style>

  <!-- XSS Protection: Safe escaping utility -->
  <script>
    // Global safe text utility - use this instead of innerHTML for user data
    window.safeText = function(str) {
      const d = document.createElement('div');
      d.textContent = String(str || '');
      return d.innerHTML;
    };
  </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-gray-800 flex flex-col relative overflow-x-hidden overflow-y-hidden" id="body-container">

<!-- INITIAL PAGE LOADING SCREEN -->
<div id="initial-loader" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-700">
    <div class="relative flex items-center justify-center mb-8">
        <!-- Outer spinning ring -->
        <svg class="absolute w-36 h-36 text-blue-100 ai-spin-slow" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="15 10">
            <circle cx="50" cy="50" r="45"></circle>
        </svg>
        <svg class="absolute w-28 h-28 text-indigo-200 ai-spin" style="animation-direction: reverse;" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="20 15">
            <circle cx="50" cy="50" r="45"></circle>
        </svg>
        <!-- Inner logo -->
        <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-blue-500/50 ai-pulse-ring text-white rotate-3">
            <svg class="w-10 h-10 -rotate-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        </div>
    </div>
    <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight">AI Beautifier</h2>
    <p class="text-gray-500 mt-3 font-medium flex items-center gap-2">
        <svg class="w-4 h-4 ai-spin text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Initializing Workspace...
    </p>
</div>

<!-- Header -->
<header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20">
    <div class="max-w-screen-2xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex items-center justify-between">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center gap-3">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            AI Article Beautifier
        </h1>
        <div class="flex gap-2">
            <button onclick="clearText()" class="px-4 py-2 text-sm font-semibold text-red-500 bg-red-50 rounded-lg hover:bg-red-100 transition">Clear All</button>
        </div>
    </div>
</header>

<!-- Main Workspace -->
<main class="max-w-screen-2xl mx-auto p-4 sm:p-6 lg:p-8 h-[calc(100vh-70px)] w-full">
    <div class="flex flex-col lg:flex-row gap-6 h-full">
        
        <!-- Left Side: Input Area & AI Tools -->
        <div class="w-full lg:w-[45%] flex flex-col bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden relative z-10">
            
            <!-- Editor Toolbar -->
            <div class="bg-gray-50 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-bold text-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    Raw Editor
                </h2>
                <button onclick="pasteText()" class="flex items-center gap-1 text-sm font-medium text-blue-600 hover:text-blue-800 bg-blue-50 px-3 py-1.5 rounded-md transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    Paste
                </button>
            </div>

            <!-- AI Tools Bar -->
            <div class="bg-white px-3 py-3 border-b border-gray-100 flex flex-wrap gap-2">
                <button onclick="runAI('improve')" class="flex-1 bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-600 hover:to-indigo-600 text-white text-xs font-bold py-2 px-3 rounded shadow transition flex items-center justify-center gap-1">
                    ✨ Improve
                </button>
                <button onclick="runAI('humanize')" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white text-xs font-bold py-2 px-3 rounded shadow transition flex items-center justify-center gap-1">
                    🤖 Humanize
                </button>
                <button onclick="runAI('images')" class="flex-1 bg-gradient-to-r from-orange-400 to-pink-500 hover:from-orange-500 hover:to-pink-600 text-white text-xs font-bold py-2 px-3 rounded shadow transition flex items-center justify-center gap-1">
                    🖼️ Images
                </button>
                <button onclick="runAI('tags')" class="flex-1 bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white text-xs font-bold py-2 px-3 rounded shadow transition flex items-center justify-center gap-1">
                    🏷️ Tags
                </button>
            </div>

            <textarea id="raw-input" class="flex-grow w-full p-6 text-gray-700 text-base leading-relaxed focus:outline-none focus:ring-0 resize-none bg-slate-50/50" placeholder="Paste your article here...&#10;&#10;Line 1: Title&#10;Line 2: Subtitle&#10;Line 3+: Paragraphs.&#10;&#10;Use AI buttons above to auto-enhance!"></textarea>
            
            <div class="p-4 bg-gray-50 border-t border-gray-200">
                <button onclick="formatArticle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-300 flex items-center justify-center gap-2 transform active:scale-[0.98]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Format & Beautify Post
                </button>
            </div>
        </div>

        <!-- Right Side: Beautiful Output Preview -->
        <div class="w-full lg:w-[55%] flex flex-col bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden relative">
            <div class="bg-gray-50 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-bold text-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    Blog Preview
                </h2>
                <div class="flex gap-2">
                    <button onclick="copyRichText()" class="flex items-center gap-1 text-sm font-semibold text-gray-700 hover:text-black bg-white border border-gray-300 shadow-sm px-3 py-1.5 rounded-md transition hover:bg-gray-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy Rich Text
                    </button>
                    <button onclick="copyHTML()" class="flex items-center gap-1 text-sm font-semibold text-white hover:text-white bg-gray-800 hover:bg-black shadow-sm px-3 py-1.5 rounded-md transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        Copy HTML
                    </button>
                </div>
            </div>
            
            <!-- Placeholder -->
            <div id="placeholder-msg" class="flex-grow flex flex-col items-center justify-center text-gray-400 p-8 text-center bg-gray-50/30">
                <svg class="w-20 h-20 mb-4 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l6 6v10a2 2 0 01-2 2z"></path></svg>
                <p class="text-xl font-medium text-gray-400 mb-2">Awaiting Content</p>
                <p class="text-sm max-w-sm">Paste your content on the left, use AI to enhance it, and hit Format!</p>
            </div>

            <!-- Formatted Article Container -->
            <div id="output-article" class="flex-grow overflow-y-auto p-8 hidden bg-white fade-in text-gray-800">
                <!-- JS Inject here -->
            </div>
        </div>

    </div>
</main>

<!-- AI Action Processing Screen -->
<div id="ai-loading" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
    <div class="relative flex items-center justify-center mb-6">
        <div class="absolute w-24 h-24 bg-blue-500 rounded-full opacity-50 ai-pulse-ring"></div>
        <svg class="absolute w-28 h-28 text-blue-300 ai-spin" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="10 5">
            <circle cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center z-10 shadow-lg">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
    </div>
    <h3 id="ai-loading-text" class="text-2xl font-bold text-white tracking-wide shadow-sm">AI is processing...</h3>
    <p class="text-blue-200 mt-2 text-sm">Applying smart enhancements</p>
</div>

<!-- Scripts -->
<script>
    // --- INITIAL PAGE LOAD ANIMATION ---
    window.addEventListener('load', () => {
        const loader = document.getElementById('initial-loader');
        const bodyTag = document.getElementById('body-container');
        
        // Let it display for 1 second, then fade out
        setTimeout(() => {
            loader.classList.add('fade-out');
            
            // Allow scrolling again after fade out
            setTimeout(() => {
                loader.style.display = 'none';
                bodyTag.classList.remove('overflow-y-hidden');
            }, 600);
        }, 1200);
    });


    // --- UTILITY: Paste from Clipboard ---
    async function pasteText() {
        try {
            const text = await navigator.clipboard.readText();
            const input = document.getElementById('raw-input');
            input.value += (input.value ? '\n\n' : '') + text;
            input.scrollTop = input.scrollHeight; // Scroll to bottom
        } catch (err) {
            alert('Failed to read clipboard. Please press Ctrl+V / Cmd+V instead.');
        }
    }

    // --- UTILITY: Copy Formatted Output (Rich Text) ---
    function copyRichText() {
        const output = document.getElementById('output-article');
        if (output.classList.contains('hidden') || output.innerHTML.trim() === '') {
            alert("Nothing to copy! Format your article first.");
            return;
        }
        
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(output);
        selection.removeAllRanges();
        selection.addRange(range);
        
        try {
            document.execCommand('copy');
            selection.removeAllRanges();
            showToast("✅ Rich Text Copied! Ready to paste into Word or WordPress.");
        } catch (err) {
            alert('Failed to copy text.');
        }
    }

    // --- UTILITY: Copy Raw HTML (With Inline Styles) ---
    function copyHTML() {
        const output = document.getElementById('output-article');
        if (output.classList.contains('hidden') || output.innerHTML.trim() === '') {
            alert("Nothing to copy! Format your article first.");
            return;
        }
        
        navigator.clipboard.writeText(output.innerHTML.trim()).then(() => {
            showToast("🧑‍💻 HTML Copied! Fully styled and ready for your CMS.");
        }).catch(() => {
            alert("Failed to copy HTML.");
        });
    }

    // --- CORE: Format Article with INLINE STYLES for CMS Support ---
    function formatArticle() {
        const rawText = document.getElementById('raw-input').value;
        if (!rawText.trim()) {
            alert("Please paste an article first!");
            return;
        }

        const blocks = rawText.split('\n').map(item => item.trim()).filter(item => item.length > 0);
        if (blocks.length === 0) return;

        let formattedHTML = `<div style="font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 0 auto; color: #374151;">\n`;

        let paragraphCount = 0;

        blocks.forEach((block, index) => {
            if (block === '[IMAGE]') {
                const randomId = Math.floor(Math.random() * 1000);
                formattedHTML += `
                    <figure style="margin: 2rem 0; text-align: center;">
                        <img src="https://picsum.photos/seed/${randomId}/800/400" alt="Blog Visual" style="max-width: 100%; height: auto; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); display: block; margin: 0 auto;">
                    </figure>\n`;
            } else if (block.startsWith('[TAGS]')) {
                const tags = block.replace('[TAGS]', '').split(',').map(t => t.trim());
                let tagsHtml = tags.map(t => `<span style="display: inline-block; background-color: #eff6ff; color: #2563eb; font-size: 0.875rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 9999px; margin-right: 0.5rem; margin-bottom: 0.5rem;">#${t}</span>`).join('');
                formattedHTML += `
                    <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;">
                        ${tagsHtml}
                    </div>\n`;
            } else if (index === 0) {
                formattedHTML += `
                    <h1 style="font-size: 2.5rem; line-height: 1.2; font-weight: 800; color: #1e3a8a; text-align: center; margin-bottom: 1rem;">
                        ${block}
                    </h1>\n`;
            } else if (index === 1) {
                formattedHTML += `
                    <h2 style="font-size: 1.25rem; font-style: italic; font-weight: 500; color: #6b7280; text-align: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 1.5rem; margin-bottom: 2rem; max-width: 80%; margin-left: auto; margin-right: auto;">
                        ${block}
                    </h2>\n`;
            } else {
                paragraphCount++;
                if (block.length < 80 && !block.endsWith('.') && !block.endsWith('!') && !block.endsWith('?')) {
                    formattedHTML += `
                        <h3 style="font-size: 1.5rem; font-weight: 700; color: #111827; margin-top: 2.5rem; margin-bottom: 1rem; padding-left: 1rem; border-left: 4px solid #3b82f6;">
                            ${block}
                        </h3>\n`;
                } else if (paragraphCount === 1) {
                    const firstLetter = block.charAt(0);
                    const restOfText = block.slice(1);
                    formattedHTML += `
                        <p style="font-size: 1.125rem; line-height: 1.8; color: #374151; margin-bottom: 1.5rem; text-align: justify;">
                            <span style="float: left; font-size: 4rem; font-weight: 900; color: #2563eb; line-height: 0.8; margin-right: 0.75rem; margin-top: 0.25rem;">${firstLetter}</span>${restOfText}
                        </p>\n`;
                } else {
                    formattedHTML += `
                        <p style="font-size: 1.125rem; line-height: 1.8; color: #374151; margin-bottom: 1.5rem; text-align: justify;">
                            ${block}
                        </p>\n`;
                }
            }
        });

        formattedHTML += `</div>`;
        const outputDiv = document.getElementById('output-article');
        outputDiv.innerHTML = formattedHTML;
        outputDiv.classList.remove('hidden');
        document.getElementById('placeholder-msg').classList.add('hidden');
    }

    // --- AI SIMULATION LOGIC ---
    function runAI(action) {
        const input = document.getElementById('raw-input');
        if (!input.value.trim()) {
            alert("Please paste an article first to use AI features!");
            return;
        }

        const loader = document.getElementById('ai-loading');
        const loaderText = document.getElementById('ai-loading-text');
        
        loader.classList.remove('hidden');
        
        if(action === 'improve') loaderText.innerText = "✨ AI is Polishing Article...";
        if(action === 'humanize') loaderText.innerText = "🤖 AI is Humanizing Text...";
        if(action === 'images') loaderText.innerText = "🖼️ AI is Finding Visuals...";
        if(action === 'tags') loaderText.innerText = "🏷️ AI is Generating Tags...";

        setTimeout(() => {
            let text = input.value;

            if (action === 'improve') {
                text = text.replace(/  +/g, ' ').replace(/\n\n+/g, '\n\n').replace(/(^\w|\.\s+\w)/gm, letter => letter.toUpperCase());
            } else if (action === 'humanize') {
                const map = { "Furthermore": "Also", "Therefore": "So", "However": "But", "Additionally": "Plus", "In conclusion": "To wrap up", "utilize": "use", "facilitate": "help" };
                Object.keys(map).forEach(key => {
                    const regex = new RegExp(`\\b${key}\\b`, 'gi');
                    text = text.replace(regex, map[key]);
                });
            } else if (action === 'images') {
                const parts = text.split('\n\n');
                if (parts.length > 2) {
                    parts.splice(2, 0, "[IMAGE]");
                    if(parts.length > 6) parts.splice(6, 0, "[IMAGE]");
                } else {
                    parts.push("[IMAGE]");
                }
                text = parts.join('\n\n');
            } else if (action === 'tags') {
                const words = text.replace(/[^a-zA-Z\s]/g, '').split(/\s+/);
                const longWords =[...new Set(words.filter(w => w.length > 6))].slice(0, 5);
                if (longWords.length > 0) {
                    text += `\n\n[TAGS] ${longWords.join(', ').toLowerCase()}, blog, ai-enhanced`;
                }
            }

            input.value = text;
            formatArticle();

            loader.classList.add('hidden');
            showToast("AI task completed successfully!");
            
        }, 1500);
    }

    // --- UTILITY: Toast Notification ---
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = "fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl font-medium text-sm z-50 fade-in";
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s ease';
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }

    function clearText() {
        document.getElementById('raw-input').value = '';
        document.getElementById('output-article').innerHTML = '';
        document.getElementById('output-article').classList.add('hidden');
        document.getElementById('placeholder-msg').classList.remove('hidden');
    }
</script>
</body>
</html>
